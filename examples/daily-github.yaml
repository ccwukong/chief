# Daily triage that starts from GitHub instead of Slack.
name: daily-github
description: Review requests and mentions on GitHub, then act on the ones you pick.
agent: claude-code
budget: { warn-usd: 2.00, max-usd: 4.00 }
inputs:
  lookback-hours: 24
  carry-over: null

nodes:
  - id: plan
    type: agent
    mcp: [github]
    model: sonnet
    prompt: |
      Read only. Do not comment, review or change anything.

      Using GitHub, find what needs my attention from the last {{inputs.lookback-hours}} hours:
      pull requests where my review is requested, pull requests of mine with new review comments
      or failing checks, and issues or discussions that mention me.
      For each: a short title, a kind (code-review | fix | reply | other), a priority (P0 to P3),
      and the URL.

      Still open from before:
      - carried over: {{inputs.carry-over}}
    output-schema:
      summary: string
      items: [{ title: string, kind: string, priority: string, url }]

  - id: choose
    type: gate
    kind: select
    from: "{{nodes.plan.output.items}}"

  - id: act
    type: map
    over: "{{nodes.choose.output.selected}}"
    mode: "{{nodes.choose.output.mode}}"
    max-parallel: 3
    on-error: continue
    node:
      type: agent
      mcp: [github]
      prompt: |
        Action item: {{item}}

        - code-review: review the pull request. Ask first (needs_input) with the review text
          before posting it.
        - reply: draft the reply. Ask first (needs_input) before posting it.
        - fix or other: explain what should be done. Change nothing.

        Report every write you performed in side_effects.
      output-schema: { result: string }
      compensate:
        prompt: "Undo these side effects where possible: {{output.side_effects}}"

  - id: feedback
    type: gate
    kind: input
    summary: "{{nodes.act.output}}"
    options: [done, restart]

edges: [plan -> choose, choose -> act, act -> feedback]
