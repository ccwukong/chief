<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-2 1 68 60" role="img" aria-label="chief">
  <title>chief</title>
  <!-- An abstract chief: a fan of feathers over a headband and a plain face. No background, so the colours are chosen to show on light and dark pages. -->
  <defs>
    <!-- One feather, pointing up from the middle of the headband; the tip is darker. -->
    <g id="feather">
      <path d="M32 31C36.2 26 36.6 14 32 5C27.4 14 27.8 26 32 31Z"/>
      <path d="M32 5C34.3 9.5 35.3 13 35.4 16.5H28.6C28.7 13 29.7 9.5 32 5Z" fill="#0f172a" fill-opacity="0.45"/>
      <path d="M32 30V9" stroke="#0f172a" stroke-opacity="0.35" stroke-width="0.9" stroke-linecap="round" fill="none"/>
    </g>
  </defs>
  <g fill="#0f766e">
    <use xlink:href="#feather" href="#feather" transform="rotate(-78 32 38)"/>
    <use xlink:href="#feather" href="#feather" transform="rotate(-26 32 38)"/>
    <use xlink:href="#feather" href="#feather" transform="rotate(26 32 38)"/>
    <use xlink:href="#feather" href="#feather" transform="rotate(78 32 38)"/>
  </g>
  <g fill="#f59e0b">
    <use xlink:href="#feather" href="#feather" transform="rotate(-52 32 38)"/>
    <use xlink:href="#feather" href="#feather" transform="rotate(0 32 38)"/>
    <use xlink:href="#feather" href="#feather" transform="rotate(52 32 38)"/>
  </g>
  <!-- Face -->
  <path d="M21.5 37.5h21v6.2c0 6.6-4.6 11.6-10.5 13.3-5.9-1.700-10.500-6.700-10.500-13.300z" fill="#e7b98f"/>
  <path d="M26 45.500h4M34 45.500h4" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Headband -->
  <rect x="19" y="32.500" width="26" height="6.500" rx="3.250" fill="#dc2626"/>
  <path d="M23.500 35.750l2-1.700 2 1.700-2 1.700zM30 35.750l2-1.700 2 1.700-2 1.700zM36.500 35.750l2-1.700 2 1.700-2 1.700z" fill="#f8fafc"/>
</svg>
